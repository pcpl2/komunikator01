# Wydanie serwera: uruchamiane tylko ręcznie (Actions → Wydanie serwera → Run workflow).
# Wersja pochodzi z crates/server/Cargo.toml; przed uruchomieniem ją podnieś i wypchnij.
# Tworzy release z tagiem server-vX.Y.Z, a na żądanie wgrywa serwer i restartuje usługę.
name: Wydanie serwera

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Wgraj na serwer i zrestartuj usługę (trwające rozmowy zerwą się na kilka sekund)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-server
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    name: Budowanie i release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Wersja i tag
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "server") | .version')
          tag="server-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag już istnieje. Podnieś wersję w crates/server/Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Rust
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@v2

      - name: Testy
        run: cargo test --locked -p protocol -p server

      # musl: jeden statyczny plik, działa na każdym Debianie niezależnie od wersji glibc.
      - name: Budowanie
        run: |
          cargo build --locked --release -p server --target "$TARGET"
          mkdir dist
          cp "target/$TARGET/release/komunikator-server" "dist/komunikator-server-${{ steps.version.outputs.version }}-linux-x86_64"
          cd dist && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Serwer ${{ steps.version.outputs.version }}" \
            --notes "Serwer komunikatora (Linux x86_64, statyczny). Instalacja: docs/wydanie.md."

  deploy:
    name: Wdrożenie na serwer
    needs: release
    if: inputs.deploy
    runs-on: ubuntu-24.04
    environment: produkcja
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: dist

      - name: SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Wgranie i restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh_opts=(-i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes)
          scp "${ssh_opts[@]}" -P "$PORT" dist/komunikator-server-*-linux-x86_64 "$USER@$HOST:/tmp/komunikator-server.new"
          ssh "${ssh_opts[@]}" -p "$PORT" "$USER@$HOST" 'set -e
            sudo install -m 755 /tmp/komunikator-server.new /usr/local/bin/komunikator-server
            rm -f /tmp/komunikator-server.new
            sudo systemctl restart komunikator
            sleep 2
            systemctl is-active komunikator'
