# Wydanie serwera: uruchamiane tylko ręcznie (Actions → Wydanie serwera → Run workflow).
# Wersję podaje się w formularzu; trafia do Cargo.toml tylko na czas budowania (bez commita),
# a tag stawiany jest na commicie, z którego uruchomiono workflow.
# Buduje obraz Dockera, publikuje go w prywatnym ghcr.io jako :X.Y.Z i :latest
# i tworzy release z tagiem server-vX.Y.Z.
name: Wydanie serwera
run-name: Wydanie serwera ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Wersja serwera (X.Y.Z, wyższa od ostatniego server-v…)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-server
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Obraz i release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - name: Wersja i tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash .github/scripts/set-version.sh server "$VERSION"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/komunikator-server" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2

      - name: Testy
        run: cargo test --locked -p protocol -p server

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Etykieta source wiąże pakiet z repozytorium: jest prywatny jak ono i dziedziczy dostęp.
      - name: Obraz
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=komunikator-server
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Serwer $VERSION" \
            --notes "$(printf 'Obraz: `%s:%s`\nDigest: `%s@%s`\n\nAktualizacja na serwerze: `docker compose pull && docker compose up -d` (docs/wydanie.md).' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST")"
