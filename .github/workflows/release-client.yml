# Wydanie klienta: uruchamiane tylko ręcznie (Actions → Wydanie klienta → Run workflow).
# Wersję podaje się w formularzu; trafia do Cargo.toml tylko na czas budowania (bez commita),
# a tag stawiany jest na commicie, z którego uruchomiono workflow.
# Tworzy release z tagiem client-vX.Y.Z: komunikator.exe dla graczy oraz, gdy jest klucz,
# podpisaną aktualizację (manifest.bin + komunikator-X.Y.Z.exe) do wgrania na serwer.
name: Wydanie klienta
run-name: Wydanie klienta ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Wersja klienta (X.Y.Z, wyższa od ostatniego client-v…)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-client
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Budowanie, podpis i release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - name: Wersja i tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if tr -d '\r' < crates/client-win/release-key.pub | grep -v '^#' | grep -qE '^0{64}$'; then
            echo "::error::crates/client-win/release-key.pub to same zera: wygeneruj klucz (komunikator-release keygen) i wpisz klucz publiczny."
            exit 1
          fi
          bash .github/scripts/set-version.sh client "$VERSION"

      - uses: Swatinem/rust-cache@v2

      # Bez testów client-win: otwierają okno, ikonę w zasobniku i urządzenia audio.
      - name: Testy
        run: cargo test --locked -p protocol -p client-core -p release

      - name: Budowanie
        run: cargo build --locked --release -p client-win -p release

      # Klucz tajny istnieje na dysku maszyny tylko na czas podpisu. Bez sekretu (klucz trzymany
      # offline) release dostaje niepodpisany exe, a aktualizację podpisuje się lokalnie.
      - name: Podpis
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir dist
          cp target/release/komunikator.exe target/release/komunikator-cli.exe dist/
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::Brak RELEASE_SIGNING_KEY: release bez podpisanej aktualizacji, podpisz ją lokalnie (docs/wydanie.md)."
          else
            key="$RUNNER_TEMP/release.key"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
            target/release/komunikator-release.exe sign --key "$key" --exe target/release/komunikator.exe \
              --version "${{ steps.version.outputs.version }}" --out update
            cp update/* dist/
          fi
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Komunikator ${{ steps.version.outputs.version }}" \
            --notes "Dla graczy: komunikator.exe (pierwsze uruchomienie: docs/pierwsze-uruchomienie.md). Aktualizacja dla zainstalowanych programów: manifest.bin i komunikator-X.Y.Z.exe skopiuj do katalogu updates obok docker-compose.yml na serwerze (docs/wydanie.md)."
