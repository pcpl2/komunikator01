# Wydanie klienta: uruchamiane tylko ręcznie (Actions → Wydanie klienta → Run workflow).
# Wersję podaje się w formularzu; trafia do Cargo.toml tylko na czas budowania (bez commita),
# a tag stawiany jest na commicie, z którego uruchomiono workflow.
# Tworzy release z tagiem client-vX.Y.Z: instalator komunikator-setup-X.Y.Z.exe i komunikator.exe
# (wersja przenośna) dla graczy oraz, gdy jest klucz, podpisaną aktualizację (manifest.bin +
# komunikator-X.Y.Z.exe) do wgrania na serwer.
name: Wydanie klienta
run-name: Wydanie klienta ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Wersja klienta (X.Y.Z, wyższa od ostatniego client-v…)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-client
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Budowanie, podpis i release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - name: Wersja i tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          bash .github/scripts/set-version.sh client "$VERSION"

      # Klucz publiczny wbudowywany w program (include_str! z release-key.pub), w kolejności:
      # wyliczony z sekretu RELEASE_SIGNING_KEY, ze zmiennej repozytorium RELEASE_PUBLIC_KEY
      # (klucz tajny offline), albo plik z repozytorium. Same zera wyłączają aktualizacje: stop.
      - name: Klucz wydań
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          pub=crates/client-win/release-key.pub
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            cargo build --locked --release -p release
            key="$RUNNER_TEMP/release.key"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
            public=$(target/release/komunikator-release.exe public --key "$key")
            source="sekret RELEASE_SIGNING_KEY"
          elif [ -n "$RELEASE_PUBLIC_KEY" ]; then
            public=$(printf '%s' "$RELEASE_PUBLIC_KEY" | tr -d '[:space:]' | tr 'A-F' 'a-f')
            source="zmienna RELEASE_PUBLIC_KEY"
          else
            public=$(tr -d '\r' < "$pub" | grep -v '^#' | grep -m1 -E '^[0-9a-fA-F]{64}$' || true)
            source="plik $pub"
          fi
          if ! printf '%s' "$public" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::Klucz publiczny z: $source nie ma postaci 64 znaków szesnastkowych."
            exit 1
          fi
          if [ "$public" = "$(printf '0%.0s' {1..64})" ]; then
            echo "::error::Brak klucza wydań: dodaj sekret RELEASE_SIGNING_KEY (albo zmienną RELEASE_PUBLIC_KEY). Klucz z samych zer wyłącza aktualizacje."
            exit 1
          fi
          printf '# Klucz publiczny wydań, wpisany przez workflow (%s).\n%s\n' "$source" "$public" > "$pub"
          echo "Klucz publiczny wydań: $public ($source)"

      - uses: Swatinem/rust-cache@v2

      # Bez testów client-win: otwierają okno, ikonę w zasobniku i urządzenia audio.
      - name: Testy
        run: cargo test --locked -p protocol -p client-core -p release

      # Serwer wbudowany w program (src/defaults.rs): okno „Mam już konto” pyta tylko o nazwę
      # i hasło, a wiersz poleceń łączy się z nim z samym --user. Sekret albo zmienna repozytorium.
      - name: Serwer w programie
        shell: bash
        env:
          SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS || vars.SERVER_ADDRESS }}
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT || vars.SERVER_FINGERPRINT }}
        run: |
          server=$(printf '%s' "$SERVER_ADDRESS" | tr -d '[:space:]')
          fingerprint=$(printf '%s' "$SERVER_FINGERPRINT" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          if ! printf '%s' "$server" | grep -qE '^[^:[:space:]]+:[0-9]{1,5}$'; then
            echo "::error::SERVER_ADDRESS (sekret albo zmienna) musi mieć postać host:port, np. gra.example.pl:7700."
            exit 1
          fi
          if ! printf '%s' "$fingerprint" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::SERVER_FINGERPRINT (sekret albo zmienna) musi mieć 64 znaki szesnastkowe z linii fingerprint: w logu serwera."
            exit 1
          fi
          echo "KOMUNIKATOR_SERVER=$server" >> "$GITHUB_ENV"
          echo "KOMUNIKATOR_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "Wbudowany serwer: $server"

      - name: Budowanie
        run: cargo build --locked --release -p client-win -p release

      # Klucz tajny istnieje na dysku maszyny tylko na czas podpisu. Bez sekretu (klucz trzymany
      # offline) release dostaje niepodpisany exe, a aktualizację podpisuje się lokalnie.
      - name: Podpis
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          mkdir dist
          cp target/release/komunikator.exe target/release/komunikator-cli.exe dist/
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::Brak RELEASE_SIGNING_KEY: release bez podpisanej aktualizacji, podpisz ją lokalnie (docs/wydanie.md)."
          else
            key="$RUNNER_TEMP/release.key"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
            target/release/komunikator-release.exe sign --key "$key" --exe target/release/komunikator.exe \
              --version "${{ steps.version.outputs.version }}" --out update
            cp update/* dist/
          fi

      # Instalator Inno Setup (installer/komunikator.iss) z tego samego komunikator.exe.
      - name: Instalator
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DExeDir=$PWD\target\release" "/DOutputDir=$PWD\dist" installer\komunikator.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Komunikator ${{ steps.version.outputs.version }}" \
            --notes "Dla graczy: komunikator-setup-${{ steps.version.outputs.version }}.exe (instalator) albo komunikator.exe (wersja przenośna); pierwsze uruchomienie: docs/pierwsze-uruchomienie.md. Aktualizacja dla zainstalowanych programów: manifest.bin i komunikator-X.Y.Z.exe skopiuj do katalogu updates obok docker-compose.yml na serwerze (docs/wydanie.md)."
