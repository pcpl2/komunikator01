# Konfiguracja serwera w kontenerze: /etc/komunikator/komunikator.toml.
# W docker-compose.yml montowana z pliku obok; zmień public_address i zrestartuj kontener.
# Adres i port UDP, na którym serwer nasłuchuje w kontenerze.
bind = "0.0.0.0:7700"
# Wolumen z certyfikatem serwera, kluczem prywatnym, bazą kont (komunikator.db) i katalogiem updates/.
data_dir = "/data"
# Adres, który trafia do zaproszeń. Zmień na prawdziwy adres serwera.
public_address = "serwer.example.pl:7700"
