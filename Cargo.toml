[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
# Wersja klienta (komunikator.exe, komunikator-cli.exe): wydanie `client-vX.Y.Z`.
# Serwer ma własną wersję w crates/server/Cargo.toml (wydanie `server-vX.Y.Z`).
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
server = { path = "crates/server" }
client-core = { path = "crates/client-core" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util", "fs"] }
quinn = "0.11"
quinn-proto = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opus = "0.4"
tempfile = "3"
bytes = "1"
ring = "0.17"
ed25519-dalek = "2"
snow = "0.10"
getrandom = "0.3"
chacha20poly1305 = "0.10"
hkdf = "0.12"
curve25519-dalek = "4"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Argon2, Opus and QUIC are very slow unoptimized; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
